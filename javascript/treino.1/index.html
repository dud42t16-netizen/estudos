<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: rgb(103, 164, 217);
            font-family: Arial, Helvetica, sans-serif;
        }

        main {
            background-color: white;
            width: 50vw;
            height: 60vh;
            margin: auto;
            margin-top: 80px;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 5px 5px 8px rgba(0, 0, 0, 0.534);
        }

        #b {
            text-align: center;
        }

        input {
            width: 100px;
            margin-top: 30px;
            padding: 3px;
        }

        h1 {
            text-align: center;
        }
    </style>
</head>
<body>
    <main>
        <div id="a">
            <h1>sistema <br> de <br> multiplicação</h1>
        </div>
        <div id="b">
            <input type="number" name="ip" id="ip1">
            x
            <input type="number" name="ip" id="ip2">
            <br>
            <input type="button" value="multiplicar" onclick="multiplicar()">
        </div>
        <br>
        <div id="res">
            resultado:
        </div>
    </main>
    <script>
        function multiplicar() {
           var n1 = window.document.getElementById('ip1');
           var n2 = window.document.querySelector('input#ip2');
           var res = window.document.getElementById('res');
           var n1 = Number(n1.value);
           var n2 = Number(n2.value);
           var m = n1 * n2;
           res.innerText = `a multiplicação entre ${n1} e ${n2} é = ${m}`;
        }
    </script>
</body>
</html>
