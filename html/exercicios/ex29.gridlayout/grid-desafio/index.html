<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid-desafio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: aliceblue;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 1.3em;
            text-align: center;
        }

        .container {
            background-color: rgb(107, 159, 255);
            height: 100vh;
            padding: 15px;

            display: grid;
            gap: 10px;
            grid-template-columns: auto auto auto auto auto;
            grid-template-rows: repeat(14, auto);
        }

        .item1 {
            background-color: white;

            grid-area: 1 / 1 / 3 / -1;
        }

        .item2 {
            background-color: rgba(255, 255, 255, 0.855);

            grid-area: 3 / 1 / 4 / -1 ;
        }

        .item3 {
            background-color: white;

            grid-area: 4 / 1 / 14 / 5;
        }

        .item4 {
            background-color: white;

            grid-area: 4 / 5 / 14 / 6;
        }

        .item5 {
            background-color: rgba(255, 255, 255, 0.858);

            grid-area: 14 / 1 / 15 / 6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item1">topo</div>
        <div class="item2">menu</div>
        <div class="item3">principal</div>
        <div class="item4">secundario</div>
        <div class="item5">rodape</div>
    </div>
</body>
</html>
