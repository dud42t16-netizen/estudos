<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid 002</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 1.2em;
        }

        .container {
            background-color: black;
            /*height: 600px;*/
            padding: 15px;

            display: grid;
            grid-template-columns: repeat(3, auto);
            gap: 15px;
            align-items: stretch;
            justify-content: normal;
            align-content: normal;
            justify-items: normal;
        }

        .item {
            background-color: rgb(163, 204, 241);
            width: 150px;
            height: 100px;
            padding: 10px;
            border-radius: 20px;
            color: white;
            text-align: center;
        }

        .container2 {
            background-color: rgb(172, 198, 252);
            height: 200px;
            width: 630px;

            display: grid;
            gap: 5px;
            grid-template-columns: 1fr 2fr 25%;
        }

        .item2 {
            background-color: antiquewhite;
            height: 40px;
            text-align: center;
            border: 2px dashed rgb(0, 55, 255);

        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">lorem 1</div>
        <div class="item">lorem 2</div>
        <div class="item">lorem 3</div>
        <div class="item">lorem 4</div>
        <div class="item">lorem 5</div>
        <div class="item">lorem 6</div>
        <div class="item">lorem 7</div>
        <div class="item">lorem 8</div>
        <div class="item">lorem 9</div>
    </div>
    <br>
    <div class="container2">
        <div class="item2">a</div>
        <div class="item2">b</div>
        <div class="item2">c</div>
    </div>
</body>
</html>
